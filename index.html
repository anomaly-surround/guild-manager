<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Guild Manager</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=20260922b">
    <link rel="stylesheet" href="css/app.css?v=20260922b">
    <link rel="stylesheet" href="css/shell.css?v=20260922b">
</head>
<body>
    <header class="app-header">
        <a class="brand" onclick="goHome()"><img src="icon.svg" alt=""><span>Guild Manager</span></a>
        <div class="header-actions" id="headerActions" style="display:none">
            <button class="btn btn-primary btn-sm" onclick="showCreateTeamModal()">Create team</button>
            <button class="btn btn-secondary btn-sm" onclick="showJoinTeamModal()">Join</button>
        </div>
        <div class="header-spacer"></div>
        <button class="icon-btn" onclick="showHelpModal()" title="Help &amp; guide">?</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">&#127769;</button>
        <div class="user-info" id="userInfo" style="display:none">
            <button class="btn btn-sm" id="upgradeBtn" style="display:none" onclick="showUpgradeModal()">Upgrade</button>
            <img class="user-avatar" id="userAvatar" src="" alt="">
            <span class="user-name" id="userName"></span>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container app-main" id="mainContent"></main>

    <div id="deathModal"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/theme-help.js?v=20260922b"></script>
    <script src="js/core.js?v=20260922b"></script>
    <script src="js/util.js?v=20260922b"></script>
    <script src="js/api.js?v=20260922b"></script>
    <script src="js/notifications.js?v=20260922b"></script>
    <script src="js/auth.js?v=20260922b"></script>
    <script src="js/billing.js?v=20260922b"></script>
    <script src="js/teams.js?v=20260922b"></script>
    <script src="js/team-view.js?v=20260922b"></script>
    <script src="js/home.js?v=20260922b"></script>
    <script src="js/bosses.js?v=20260922b"></script>
    <script src="js/members.js?v=20260922b"></script>
    <script src="js/settings.js?v=20260922b"></script>
    <script src="js/loot.js?v=20260922b"></script>
    <script src="js/dkp.js?v=20260922b"></script>
    <script src="js/availability.js?v=20260922b"></script>
    <script src="js/events.js?v=20260922b"></script>
    <script src="js/timers.js?v=20260922b"></script>
    <script src="js/main.js?v=20260922b"></script>
</body>
</html>
